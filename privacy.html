<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>プライバシーポリシー | 万馬券クラブ</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg-primary: #80F6FF;
      --card-bg: #FFFFFF;
      --accent: #4FD1C5;
      --text-primary: #2D3748;
      --text-secondary: #4A5568;
      --font: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      line-height: 1.8;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .page {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 20px 16px 36px;
    }

    .card {
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: var(--card-bg);
      padding: 18px 14px;
    }

    h1 {
      margin: 0 0 16px;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.45;
    }

    h2 {
      margin: 18px 0 8px;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.5;
    }

    p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.8;
    }

    .br {
      display: block;
    }

    a {
      color: inherit;
      font-weight: 800;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <h1>
        <span class="br">プライバシー</span>
        <span class="br">ポリシー</span>
      </h1>
      <h2>個人情報の利用目的</h2>
      <p>
        <span class="br">取得した情報は、</span>
        <span class="br">LINE配信やお問い合わせ対応、</span>
        <span class="br">サービス改善のために利用します。</span>
      </p>
      <h2>第三者提供について</h2>
      <p>
        <span class="br">法令に基づく場合を除き、</span>
        <span class="br">本人の同意なく第三者へ提供しません。</span>
      </p>
      <h2>免責事項</h2>
      <p>
        <span class="br">掲載内容は個人の感想であり、</span>
        <span class="br">成果を保証するものではありません。</span>
      </p>
      <p><a href="./index.html">LPへ戻る</a></p>
    </article>
  </main>
</body>
</html>
