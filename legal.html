<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>特定商取引法に基づく表記 | 万馬券クラブ</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg-primary: #CFF8D7;
      --card-bg: #FFFFFF;
      --accent: #2EB872;
      --text-primary: #2D3748;
      --text-secondary: #4A5568;
      --font: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      line-height: 1.8;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .page {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 20px 16px 36px;
    }

    .card {
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: var(--card-bg);
      padding: 18px 14px;
    }

    h1 {
      margin: 0 0 16px;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.45;
    }

    dl {
      display: grid;
      gap: 12px;
      margin: 0;
    }

    dt {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
    }

    dd {
      margin: 4px 0 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.75;
    }

    .br {
      display: block;
    }

    a {
      color: inherit;
      font-weight: 800;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <h1>
        <span class="br">特定商取引法に</span>
        <span class="br">基づく表記</span>
      </h1>
      <dl>
        <div>
          <dt>サービス名</dt>
          <dd>万馬券クラブ</dd>
        </div>
        <div>
          <dt>運営者</dt>
          <dd>万馬券クラブ運営事務局</dd>
        </div>
        <div>
          <dt>所在地</dt>
          <dd>請求があった場合に遅滞なく開示します。</dd>
        </div>
        <div>
          <dt>連絡先</dt>
          <dd>LINEまたは指定フォームよりお問い合わせください。</dd>
        </div>
        <div>
          <dt>販売価格</dt>
          <dd>LINE登録および無料配信の閲覧は無料です。</dd>
        </div>
        <div>
          <dt>注意事項</dt>
          <dd>
            <span class="br">掲載内容は個人の感想であり、</span>
            <span class="br">成果を保証するものではありません。</span>
            <span class="br">馬券の購入は自己判断でお願いします。</span>
          </dd>
        </div>
      </dl>
      <p><a href="./index.html">LPへ戻る</a></p>
    </article>
  </main>
</body>
</html>
